spring:
  application:
    name: ProductDemoAOP
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 20
      max-wait: 10000
      validation-query: SELECT 1
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    time-zone: GMT+8
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
    encoding: UTF-8
server:
  port: 8080
  tomcat:
    threads:
      max: 100
      min-spare: 5
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
logging:
  level:
    cn.edu.xmu.javaee: INFO
