global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/recording.yml
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['172.31.13.146:9100']
        labels: {role: compiler}
      - targets: ['172.31.12.145:9100']
        labels: {role: app}
      - targets: ['172.31.12.231:9100']
        labels: {role: db}
      - targets: ['172.31.7.102:9100']
        labels: {role: monitor}
  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['172.31.12.145:18080']
